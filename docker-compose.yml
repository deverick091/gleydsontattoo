version: '3.8'

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: gleydsontattoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gleydsontattoo
      POSTGRES_PASSWORD: gleydsontattoo_dev
      POSTGRES_DB: gleydsontattoo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gleydsontattoo']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express.js) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gleydsontattoo-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://gleydsontattoo:gleydsontattoo_dev@postgres:5432/gleydsontattoo?schema=public
    env_file:
      - .env
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gleydsontattoo-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

